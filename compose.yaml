# Opcjonalna lokalna baza PostgreSQL. Aplikacja, build i testy jej nie wymagają.
# Uruchomienie: docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter
      POSTGRES_DB: starter
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - starter-postgres:/var/lib/postgresql/data

volumes:
  starter-postgres:
