# Opcjonalna lokalna baza PostgreSQL. Aplikacja, build i testy jej nie wymagają.
# Uruchomienie: docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: krajozbior
      POSTGRES_PASSWORD: krajozbior
      POSTGRES_DB: krajozbior
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - krajozbior-postgres:/var/lib/postgresql/data

volumes:
  krajozbior-postgres:
