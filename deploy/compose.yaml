# Docker Compose serwera (D-E11-1). Usługi: db (PostgreSQL 17), app (Next.js),
# proxy (Caddy) i jednorazowe ops (polecenia operatora).
#
# Zasady, które pilnuje test tests/deploy/compose-config.test.ts:
#   - sekcję `ports:` ma wyłącznie `proxy` (Docker omija zaporę ufw dla opublikowanych portów),
#   - każda usługa ma `restart: unless-stopped` i sterownik logów journald (D-E11-5),
#   - tu nie ma zmiennych pokazu ani trzech flag demo (lista w docs/deployment.md);
#     leżą w deploy/showcase.env i nakładce compose.showcase.yaml,
#   - hasło superużytkownika bazy jest jednorazowym plikiem (D-E11-11), nie zmienną środowiska,
#     i tylko w nakładce pierwszego startu deploy/compose.init.yaml: zwykły start bazy nie
#     potrzebuje pliku z /run, którego po restarcie serwera już nie ma.
# Ścieżki względne liczą się od katalogu tego pliku (deploy/).
name: krajozbior

x-logging: &logging
  driver: journald
  options:
    tag: "krajozbior-{{.Name}}"

services:
  db:
    # Przypięte skrótem jak Node i Caddy. Odświeżenie: `docker pull postgres:17`, potem
    # `docker inspect --format '{{index .RepoDigests 0}}' postgres:17`.
    image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: krajozbior
      # Bez `trust` w pg_hba.conf: gniazdo tylko dla `peer` (docker exec -u postgres), TCP zawsze
      # z hasłem (także z 127.0.0.1). Ustawienie zapisuje się przy pierwszej inicjalizacji wolumenu.
      POSTGRES_INITDB_ARGS: "--auth-local=peer --auth-host=scram-sha-256"
    # Logi bez danych osobowych (D-E11-5): żadnych instrukcji, parametrów ani linii DETAIL.
    # log_min_error_statement=panic: przy błędzie zapytania baza nie dopisuje jego tekstu. MikroORM
    # wkleja wartości w tekst zapytania, więc same ustawienia parametrów ich nie ukrywają (DB-5).
    command:
      - postgres
      - -c
      - log_min_error_statement=panic
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_error_verbosity=terse
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d krajozbior"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: krajozbior-app:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    logging: *logging
    # Tylko zmienne aplikacji (D-E11-4). Haseł ról `owner` i `ops` ani adresów
    # DATABASE_MIGRATION_URL, DATABASE_OPS_URL, DATABASE_ADMIN_URL tu nie ma: operator ma własny plik.
    env_file:
      - path: ${KRAJOZBIOR_ENV_FILE:-/srv/krajozbior/.env.production}
        required: false
    # Górna granica pamięci: nadużycie aplikacji nie zabiera pamięci bazie na tym samym serwerze.
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  proxy:
    image: caddy:2@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Bramka hasła przed otwarciem serwisu (spec 5.4a): plik `gate.caddy` kładzie i zdejmuje
      # skrypt wdrożenia (scripts/ops/); pusty katalog = serwis otwarty.
      - ${KRAJOZBIOR_CADDY_GATE_DIR:-/srv/krajozbior/caddy-gate}:/etc/caddy/gate:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # Jednorazowe polecenia operatora: `docker compose run --rm ops npm run db:migrate`.
  # Nie startuje z `up` (profil), a `run` i tak ignoruje politykę restartu.
  ops:
    image: krajozbior-ops:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile
      target: ops
    restart: unless-stopped
    logging: *logging
    profiles:
      - ops
    # Własny plik operatora, nie `.env.production` aplikacji: hasła ról `owner` i `ops` (adresy
    # DATABASE_MIGRATION_URL, DATABASE_OPS_URL, DATABASE_ADMIN_URL) nie trafiają do procesu
    # wystawionego do internetu. Poleceniom `auth:create-admin` i `auth:throttle` plik musi też
    # dać DATABASE_AUTH_URL, BETTER_AUTH_SECRET (identyczny jak w aplikacji), BETTER_AUTH_URL
    # i AUTH_CLIENT_IP_HEADER (przy NODE_ENV=production ustawienia logowania wymagają obu, jak w aplikacji);
    # klucza poczty nie potrzebuje żadne polecenie operatora (lista: docs/deployment.md).
    # Domyślnie w /run (pamięć RAM, znika po restarcie): skrypt wdrożenia kładzie go na czas poleceń.
    env_file:
      - path: ${KRAJOZBIOR_OPS_ENV_FILE:-/run/krajozbior/ops.env}
        required: false
    # Na serwerze `db:seed:demo` odmawia w produkcji niezależnie od adresu bazy, a `catalog:import`
    # też, chyba że dostanie jawny tryb `--target server` z potwierdzeniem hosta (F-K6; uruchamia go
    # tylko tryb `-Import` skryptu wdrożenia, katalog z plikiem montowany tylko do odczytu).
    # Kontener nie dzieli sieci z bazą (pilnuje tego test); tylko nakładka pokazu nadpisuje NODE_ENV.
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    name: krajozbior-pgdata
  caddy-data:
    name: krajozbior-caddy-data
  caddy-config:
    name: krajozbior-caddy-config
