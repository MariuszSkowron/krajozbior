version: 2
updates:
  # Minor and patch updates arrive as one grouped PR (one CI run instead of
  # one per package); major updates stay separate, each needs its own review.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: "Etc/UTC"
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: "Etc/UTC"
    groups:
      github-actions:
        patterns:
          - "*"
